<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Diagnóstico</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; }
        #mapa { height: 400px; width: 100%; background: #eee; border: 2px solid red; }
    </style>
</head>
<body>
    <h1>Diagnóstico do Mapa</h1>
    <div id="mapa"></div>
    <p id="status">Testando conexão...</p>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const status = document.getElementById('status');
        try {
            const mapa = L.map('mapa').setView([-10.9472, -37.0731], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
            L.marker([-10.9472, -37.0731]).addTo(mapa).bindPopup("Teste de Aracaju");
            status.innerHTML = "O Leaflet carregou com sucesso. Se o mapa estiver em branco, o servidor do OpenStreetMap está bloqueado.";
        } catch (e) {
            status.innerHTML = "Erro ao carregar o Leaflet: " + e.message;
        }
    </script>
</body>
</html>

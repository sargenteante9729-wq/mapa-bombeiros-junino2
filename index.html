<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Municípios atendidos nos festejos juninos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

    <style>
        /* ========================================== */
        /* ESTILOS GERAIS                             */
        /* ========================================== */
        body { margin: 0; padding: 0; display: flex; font-family: Arial, sans-serif; background-color: #f4f4f9; overflow: hidden; height: 100vh; }
        
        #menu-lateral { 
            background-color: #ffffff; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.1); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }
        
        #menu-lateral h2 { 
            background-color: #d32f2f; 
            color: white; 
            margin: 0; 
            padding: 15px 20px; 
            font-size: 1.1rem; 
            text-align: center; 
            cursor: pointer; 
            user-select: none;
            white-space: nowrap;
        }
        
        ul#lista-cidades { list-style-type: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        ul#lista-cidades li { padding: 15px 20px; border-bottom: 1px solid #eeeeee; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; font-weight: bold; color: #333; }
        ul#lista-cidades li:hover { background-color: #ffebee; color: #d32f2f; }
        
        .status-risco-lista { margin-right: 12px; font-size: 1.1rem; display: inline-block; }
        
        #mapa { flex-grow: 1; height: 100%; width: 100%; }
        
        /* MARCADORES TÁTICOS DO MAPA */
        .marcador-bombeiro {
            font-size: 18px;
            text-align: center;
            width: 36px !important;
            height: 36px !important;
            border-radius: 50%;
            background: white;
            box-shadow: 0 3px 7px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .risco-alto { border: 3px solid #d32f2f; background-color: #ffebee; }
        .risco-medio { border: 3px solid #fbc02d; background-color: #fffde7; }
        .risco-baixo { border: 3px solid #388e3c; background-color: #e8f5e9; }
        .risco-padrao { border: 3px solid #9e9e9e; background-color: #f5f5f5; }
        
        .info-popup { min-width: 250px; max-width: 300px; font-size: 13px; }
        .info-popup h3 { margin: 0 0 10px 0; color: #d32f2f; font-size: 18px; border-bottom: 2px solid #d32f2f; padding-bottom: 5px; }
        .info-popup h4 { margin: 12px 0 5px 0; color: #444; background-color: #f5f5f5; padding: 3px; border-radius: 3px; }
        .info-popup p { margin: 3px 0; line-height: 1.4; }

        .leaflet-control-layers {
            border-radius: 8px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2) !important;
            font-size: 12px;
            font-weight: bold;
        }

        /* ========================================== */
        /* CARD DE LEGENDA INTERATIVO                 */
        /* ========================================== */
        .legenda-container {
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #333;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        
        .legenda-alto { border: 2px solid #d32f2f !important; background-color: #fff8f8; }
        .legenda-medio { border: 2px solid #fbc02d !important; background-color: #fffff2; }
        .legenda-baixo { border: 2px solid #388e3c !important; background-color: #f8fff8; }
        .legenda-padrao { border: 2px solid #9e9e9e !important; background-color: #fafafa; }

        .legenda-titulo {
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 10px;
            color: #555;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
        .legenda-linha {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-weight: bold;
            transition: all 0.2s ease;
            transform-origin: left center;
        }
        .legenda-linha:last-child { margin-bottom: 0; }
        
        .legenda-circulo {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
        }
        .lc-alto { border: 2px solid #d32f2f; background-color: #ffebee; }
        .lc-medio { border: 2px solid #fbc02d; background-color: #fffde7; }
        .lc-baixo { border: 2px solid #388e3c; background-color: #e8f5e9; }
        .lc-padrao { border: 2px solid #9e9e9e; background-color: #f5f5f5; }

        /* ========================================== */
        /* CONFIGURAÇÕES PARA COMPUTADOR              */
        /* ========================================== */
        @media (min-width: 769px) {
            body { flex-direction: row; }
            #menu-lateral { width: 320px; height: 100%; transition: transform 0.3s ease, margin-right 0.3s ease; }
            #menu-lateral.recolhido { transform: translateX(-275px); margin-right: -275px; }
        }

        /* ========================================== */
        /* CONFIGURAÇÕES PARA CELULAR (MOBILE)        */
        /* ========================================== */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #menu-lateral { width: 100%; height: 40vh; transition: height 0.3s ease; }
            #menu-lateral.recolhido { height: 48px !important; }
            #menu-lateral.recolhido ul#lista-cidades { display: none !important; }
            #menu-lateral h2 { font-size: 1rem; padding: 12px 15px; }
            #menu-lateral h2::after { content: ' ↕'; font-size: 0.8rem; opacity: 0.8; }
            #mapa { flex-grow: 1; height: auto; width: 100%; }
            ul#lista-cidades li { padding: 12px 15px; }
            .info-popup { min-width: 200px; max-width: 240px; }
            
            .legenda-container { padding: 6px 10px; font-size: 11px; max-width: 130px; }
            .legenda-linha { margin-bottom: 4px; }
            .legenda-titulo { margin-bottom: 5px; }

            .leaflet-left { margin-left: 10px !important; }
            .leaflet-bottom { margin-bottom: 25px !important; }
        }
    </style>
</head>
<body>

    <div id="menu-lateral">
        <h2>Municípios atendidos nos festejos juninos</h2>
        <ul id="lista-cidades"></ul>
    </div>
    <div id="mapa"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="dados.js"></script>

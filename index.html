<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Municípios atendidos nos festejos juninos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <style>
        /* ESTILOS E RESPONSIVIDADE */
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; background-color: #f4f4f9; overflow: hidden; }
        #menu-lateral { width: 320px; background-color: #ffffff; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column; }
        #menu-lateral h2 { background-color: #d32f2f; color: white; margin: 0; padding: 15px 20px; font-size: 1.1rem; text-align: center; }
        ul#lista-cidades { list-style-type: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        ul#lista-cidades li { padding: 15px 20px; border-bottom: 1px solid #eeeeee; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; font-weight: bold; color: #333; }
        ul#lista-cidades li:hover { background-color: #ffebee; color: #d32f2f; }
        ul#lista-cidades li::before { content: '🚒'; margin-right: 10px; }
        
        #mapa { flex-grow: 1; height: 100%; width: 100%; }
        .marcador-bombeiro { font-size: 24px; text-align: center; line-height: 24px; }
        
        /* Oculta a caixa de texto de direções que o plugin de rotas cria por padrão */
        .leaflet-routing-container { display: none !important; }
        
        /* Estilos do Popup */
        .info-popup { min-width: 250px; max-width: 300px; font-size: 13px; }
        .info-popup h3 { margin: 0 0 10px 0; color: #d32f2f; font-size: 18px; border-bottom: 2px solid #d32f2f; padding-bottom: 5px; }
        .info-popup h4 { margin: 12px 0 5px 0; color: #444; background-color: #f5f5f5; padding: 3px; border-radius: 3px; }
        .info-popup p { margin: 3px 0; line-height: 1.4; }
        
        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #menu-lateral { width: 100%; height: 40vh; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
            #mapa { height: 60vh; }
            #menu-lateral h2 { font-size: 1rem; padding: 12px 15px; }
            ul#lista-cidades li { padding: 12px 15px; }
            .info-popup { min-width: 200px; max-width: 240px; }
        }
    </style>
</head>
<body>

    <div id="menu-lateral">
        <h2>Municípios atendidos nos festejos juninos</h2>
        <ul id="lista-cidades"></ul>
    </div>
    <div id="mapa"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // =========================================================================
        // SUA PLANILHA MANUAL DE DADOS OPERACIONAIS
        // =========================================================================
        const PLANILHA_MANUAL = [
            {
                nome: "Aracaju", lat: -10.9472, lon: -37.0731,
                abts: "1", ur: "2", efetivo: "30+", risco: "Alto", coordenacao: "1º GBM", publico: "30.000+",
                eventos_programados: "🎤 Vila do Forró: 01 a 30/06\n🎤 Arraiá do Povo: 29/05 a 28/06\n🎤 Forró Caju: 29/05 a 28/07",
                eventos_complementares: "📍 Praça Santos Dumont (12 e 13/06): 🚑 01 viatura\n📍 Conj. Augusto Franco (04, 05 e 06/06): 🚑 01 viatura"
            },
            {
                nome: "Estância", lat: -11.2683, lon: -37.4386,
                abts: "1", ur: "1", efetivo: "12", risco: "Médio", coordenacao: "2º GBM", publico: "15.000+",
                eventos_programados: "🎤 Forró do Abandono\n🎤 Festejos Principais",
                eventos_complementares: "📍 Centro Cultural: 🚒 Apoio preventivo"
            },
            { nome: "Barra dos Coqueiros", lat: -10.9089, lon: -37.0383, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Canindé de São Francisco", lat: -9.6617, lon: -37.7897, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Cristinápolis", lat: -11.4756, lon: -37.7583, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Itabaiana", lat: -10.6850, lon: -37.4278, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Nossa Senhora do Socorro", lat: -10.8550, lon: -37.1261, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Areia Branca", lat: -10.7589, lon: -37.3139, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Capela", lat: -10.5069, lon: -37.0528, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Itaporanga d'Ajuda", lat: -10.9981, lon: -37.3078, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Lagarto", lat: -10.9139, lon: -37.6681, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Rosário do Catete", lat: -10.6956, lon: -37.0350, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" },
            { nome: "Tobias Barreto", lat: -11.1839, lon: -38.0000, abts: "", ur: "", efetivo: "", risco: "", coordenacao: "", publico: "", eventos_programados: "", eventos_complementares: "" }
        ];
        // =========================================================================

        // Inicializar o mapa base centrado em Sergipe
        const mapa = L.map('mapa', { zoomControl: false }).setView([-10.7, -37.4], 8);
        L.control.zoom({ position: 'topright' }).addTo(mapa);
        
        // Servidor CartoDB Voyager: Extremamente estável
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { 
            attribution: '© OpenStreetMap contributors © CartoDB' 
        }).addTo(mapa);
        
        const ARACAJU = L.latLng(-10.9472, -37.0731);
        let controleRota;
        let carrinhoAnimado;
        let timerAnimacao;

        const iconeBombeiro = L.divIcon({
            html: '🚒', className: 'marcador-bombeiro', iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -15]
        });

        const listaCidadesElemento = document.getElementById('lista-cidades');

        // Configura e gera o traçado na tela
        function tracarRotaOperacional(latDestino, lonDestino, marcadorDestino) {
            if (controleRota) {
                mapa.removeControl(controleRota);
            }
            
            controleRota = L.Routing.control({
                waypoints: [ARACAJU, L.latLng(latDestino, lonDestino)],
                lineOptions: {
                    styles: [{ color: '#d32f2f', weight: 5, opacity: 0.85 }]
                },
                createMarker: function() { return null; }, 
                addWaypoints: false,
                draggableWaypoints: false,
                fitSelectedRoutes: true 
            }).addTo(mapa);

            // Assim que as estradas forem calculadas, inicia a viagem do carrinho
            controleRota.on('routesfound', function(e) {
                const coordenadasEstrada = e.routes[0].coordinates;
                deslocarViatura(coordenadasEstrada, marcadorDestino);
            });
        }

        // Função responsável pelo efeito do carrinho andando na estrada
        function deslocarViatura(coordenadas, marcadorDestino) {
            // Limpa qualquer animação rodando antes para evitar bugs caso clique rápido
            if (timerAnimacao) clearInterval(timerAnimacao);
            if (carrinhoAnimado) mapa.removeLayer(carrinhoAnimado);

            if (!coordenadas || coordenadas.length === 0) return;

            // Cria a viatura na posição inicial (Aracaju)
            carrinhoAnimado = L.marker(coordenadas[0], { icon: iconeBombeiro }).addTo(mapa);

            let index = 0;
            const totalPontos = coordenadas.length;
            
            // Ritmo do motor: ajusta dinamicamente a velocidade para durar ~1.8 segundos a viagem
            const totalPassosFrames = 90; 
            const incremento = Math.max(1, Math.round(totalPontos / totalPassosFrames));

            timerAnimacao = setInterval(() => {
                index += incremento;
                
                // Chegou ao destino final
                if (index >= totalPontos) {
                    clearInterval(timerAnimacao);
                    carrinhoAnimado.setLatLng(coordenadas[totalPontos - 1]);
                    
                    // Dispara o Balão de Informações Operacionais da Cidade
                    if (marcadorDestino) marcadorDestino.openPopup();
                    
                    // Apaga o carrinho temporário de animação (já que a cidade já tem o dela fixo)
                    setTimeout(() => {
                        if (carrinhoAnimado) mapa.removeLayer(carrinhoAnimado);
                    }, 800);
                    return;
                }
                
                // Move o carrinho para o próximo ponto da rodovia
                carrinhoAnimado.setLatLng(coordenadas[index]);
            }, 20); // Atualiza a posição a cada 20 milissegundos (Suavidade de 50 FPS)
        }

        function formatarTexto(texto) {
            if (!texto) return '';
            return texto.replace(/\n/g, '<br>');
        }

        function gerarHTMLPopup(linha) {
            if (!linha.efetivo && !linha.abts) {
                return `<div class="info-popup"><h3>${linha.nome}</h3><p>Informações operacionais em breve...</p></div>`;
            }

            let html = `<div class="info-popup"><h3>${linha.nome}</h3>`;
            html += `<h4>Informações Gerais</h4>
                     <p>🚒 ABTs: ${linha.abts || '-'}</p>
                     <p>🚑 UR: ${linha.ur || '-'}</p>
                     <p>👨‍🚒 Efetivo: ${linha.efetivo || '-'}</p>
                     <p>⚠️ Risco: ${linha.risco || '-'}</p>
                     <p>👨‍🚒 Coordenação: ${linha.coordenacao || '-'}</p>
                     <p>👥 Público Estimado: ${linha.publico || '-'}</p>`;

            if (linha.eventos_programados) {
                html += `<h4>Eventos Programados</h4><p>${formatarTexto(linha.eventos_programados)}</p>`;
            }

            if (linha.eventos_complementares) {
                html += `<h4>Eventos Complementares</h4><p>${formatarTexto(linha.eventos_complementares)}</p>`;
            }

            html += `</div>`;
            return html;
        }

        // Renderiza as cidades no mapa e gera a lista lateral
        PLANILHA_MANUAL.forEach(cidade => {
            const latCidade = parseFloat(cidade.lat);
            const lonCidade = parseFloat(cidade.lon);
            const htmlDoBalao = gerarHTMLPopup(cidade);

            const marcador = L.marker([latCidade, lonCidade], { icon: iconeBombeiro })
                .addTo(mapa)
                .bindPopup(htmlDoBalao);

            const itemLista = document.createElement('li');
            itemLista.textContent = cidade.nome;
            
            itemLista.onclick = () => {
                tracarRotaOperacional(latCidade, lonCidade, marcador);
            };

            listaCidadesElemento.appendChild(itemLista);
        });
    </script>
</body>
</html>

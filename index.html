<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Festejos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; height: 100vh; }
        #menu { width: 300px; overflow-y: auto; border-right: 1px solid #ccc; background: #f4f4f4; }
        .item-cidade { padding: 15px; border-bottom: 1px solid #ddd; cursor: pointer; }
        .item-cidade:hover { background: #e0e0e0; }
        #mapa { flex-grow: 1; }
    </style>
</head>
<body>
    <div id="menu">
        <h2 style="text-align:center;">Cidades</h2>
        <div id="lista"></div>
    </div>
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const mapa = L.map('mapa').setView([-10.9472, -37.0731], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').render();
        
        const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRRv-CBDj8UMUo32h5_wkViXlTX72qRCoKOOM3gKxvpT3XAcYwd_ZemvShx87VPRUNU1B4PTZZkVn0P/pub?output=csv';

        Papa.parse(URL, {
            download: true, header: true,
            complete: function(res) {
                res.data.forEach(c => {
                    const lat = parseFloat(c.lat);
                    const lon = parseFloat(c.lon);
                    
                    if (!isNaN(lat) && !isNaN(lon)) {
                        // Adiciona o marcador (carrinho)
                        L.marker([lat, lon]).addTo(mapa).bindPopup("<b>" + c.nome + "</b>");
                        
                        // Adiciona no menu
                        const div = document.createElement('div');
                        div.className = 'item-cidade';
                        div.textContent = c.nome;
                        div.onclick = () => mapa.setView([lat, lon], 12);
                        document.getElementById('lista').appendChild(div);
                    }
                });
            }
        });
    </script>
</body>
</html>

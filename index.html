<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Operacional - Bombeiros SE</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { height: 100%; margin: 0; padding: 0; display: flex; overflow: hidden; }
        
        #menu-lateral { 
            width: 320px; height: 100vh; background: white; 
            display: flex; flex-direction: column; z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }
        
        #mapa { 
            flex-grow: 1; 
            height: 100vh; 
            display: block; /* Garante visibilidade */
            background: #ddd;
        }

        #menu-lateral h2 { background: #d32f2f; color: white; margin: 0; padding: 15px; font-size: 1rem; text-align: center; }
        
        ul#lista-cidades { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        ul#lista-cidades li { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-weight: bold; }
        ul#lista-cidades li:hover { background: #ffebee; }

        .marcador-bombeiro {
            background: #d32f2f; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; border: 2px solid white;
        }
    </style>
</head>
<body>

    <div id="menu-lateral">
        <h2>Quartel QCG - Saída</h2>
        <ul id="lista-cidades"></ul>
    </div>
    
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="dados.js"></script>

    <script>
        // Coordenadas exatas do Quartel na Rua Siriri
        const LAT_QUARTEL = -10.9126;
        const LON_QUARTEL = -37.0543;

        const mapa = L.map('mapa').setView([-10.7, -37.4], 8);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mapa);

        // Marcador do Quartel
        L.marker([LAT_QUARTEL, LON_QUARTEL]).addTo(mapa)
            .bindPopup("<b>QCG - Bombeiros</b><br>Rua Siriri, 805");

        let linhaRota, carro;

        function desenharRota(lat, lon) {
            if (linhaRota) mapa.removeLayer(linhaRota);
            if (carro) mapa.removeLayer(carro);

            const url = `https://router.project-osrm.org/route/v1/driving/${LON_QUARTEL},${LAT_QUARTEL};${lon},${lat}?overview=full&geometries=geojson`;

            fetch(url).then(r => r.json()).then(data => {
                const coords = data.routes[0].geometry.coordinates.map(p => [p[1], p[0]]);
                linhaRota = L.polyline(coords, {color: '#d32f2f', weight: 5}).addTo(mapa);
                mapa.fitBounds(linhaRota.getBounds());
                
                // Animação simples do carro
                carro = L.marker(coords[0], {
                    icon: L.divIcon({className: 'marcador-bombeiro', html: '🚒'})
                }).addTo(mapa);

                let i = 0;
                const animar = setInterval(() => {
                    if (i >= coords.length) clearInterval(animar);
                    else carro.setLatLng(coords[i++]);
                }, 50);
            });
        }

        // Listagem dos dados
        const lista = document.getElementById('lista-cidades');
        PLANILHA_MANUAL.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item.nome;
            li.onclick = () => desenharRota(item.lat, item.lon);
            lista.appendChild(li);
        });

        // Força o mapa a aparecer
        setTimeout(() => mapa.invalidateSize(), 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Teste</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #mapa { height: 100vh; width: 100vw; background: #ddd; }
    </style>
</head>
<body>
    <div id="mapa"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <script>
        try {
            const mapa = L.map('mapa').setView([-10.9472, -37.0731], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
            L.marker([-10.9472, -37.0731]).addTo(mapa).bindPopup("Aracaju").openPopup();
        } catch (e) {
            document.getElementById('mapa').innerHTML = "<h1>Erro ao carregar o mapa: " + e.message + "</h1>";
        }
    </script>
</body>
</html>

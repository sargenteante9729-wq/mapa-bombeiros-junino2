<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Municípios atendidos nos festejos juninos</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

    <style>
        /* ========================================== */
        /* ESTILOS GERAIS                             */
        /* ========================================== */
        body { margin: 0; padding: 0; display: flex; font-family: Arial, sans-serif; background-color: #f4f4f9; overflow: hidden; height: 100vh; }
        
        #menu-lateral { 
            background-color: #ffffff; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.1); 
            z-index: 1000; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }
        
        #menu-lateral h2 { 
            background-color: #d32f2f; 
            color: white; 
            margin: 0; 
            padding: 15px 20px; 
            font-size: 1.1rem; 
            text-align: center; 
            cursor: pointer; 
            user-select: none;
            white-space: nowrap;
        }
        
        ul#lista-cidades { list-style-type: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        ul#lista-cidades li { padding: 15px 20px; border-bottom: 1px solid #eeeeee; cursor: pointer; transition: background-color 0.2s; display: flex; align-items: center; font-weight: bold; color: #333; }
        ul#lista-cidades li:hover { background-color: #ffebee; color: #d32f2f; }
        
        .status-risco-lista { margin-right: 12px; font-size: 1.1rem; display: inline-block; }
        
        #mapa { flex-grow: 1; height: 100%; width: 100%; }
        
        /* MARCADORES TÁTICOS DO MAPA */
        .marcador-bombeiro {
            font-size: 18px;
            text-align: center;
            width: 36px !important;
            height: 36px !important;
            border-radius: 50%;
            background: white;
            box-shadow: 0 3px 7px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .risco-alto { border: 3px solid #d32f2f; background-color: #ffebee; }
        .risco-medio { border: 3px solid #fbc02d; background-color: #fffde7; }
        .risco-baixo { border: 3px solid #388e3c; background-color: #e8f5e9; }
        .risco-padrao { border: 3px solid #9e9e9e; background-color: #f5f5f5; }
        
        .info-popup { min-width: 250px; max-width: 300px; font-size: 13px; }
        .info-popup h3 { margin: 0 0 10px 0; color: #d32f2f; font-size: 18px; border-bottom: 2px solid #d32f2f; padding-bottom: 5px; }
        .info-popup h4 { margin: 12px 0 5px 0; color: #444; background-color: #f5f5f5; padding: 3px; border-radius: 3px; }
        .info-popup p { margin: 3px 0; line-height: 1.4; }

        .leaflet-control-layers {
            border-radius: 8px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2) !important;
            font-size: 12px;
            font-weight: bold;
        }

        /* ========================================== */
        /* CARD DE LEGENDA INTERATIVO (BASE)          */
        /* ========================================== */
        .legenda-container {
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #333;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        
        .legenda-alto { border: 2px solid #d32f2f !important; background-color: #fff8f8; }
        .legenda-medio { border: 2px solid #fbc02d !important; background-color: #fffff2; }
        .legenda-baixo { border: 2px solid #388e3c !important; background-color: #f8fff8; }
        .legenda-padrao { border: 2px solid #9e9e9e !important; background-color: #fafafa; }

        .legenda-titulo {
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 10px;
            color: #555;
            letter-spacing: 0.6px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }
        .legenda-linha {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-weight: bold;
            transition: all 0.2s ease;
            transform-origin: left center;
        }
        .legenda-linha:last-child { margin-bottom: 0; }
        
        .legenda-circulo {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
        }
        .lc-alto { border: 2px solid #d32f2f; background-color: #ffebee; }
        .lc-medio { border: 2px solid #fbc02d; background-color: #fffde7; }
        .lc-baixo { border: 2px solid #388e3c; background-color: #e8f5e9; }
        .lc-padrao { border: 2px solid #9e9e9e; background-color: #f5f5f5; }

        /* ========================================== */
        /* CONFIGURAÇÕES PARA COMPUTADOR              */
        /* ========================================== */
        @media (min-width: 769px) {
            body { flex-direction: row; }
            #menu-lateral { width: 320px; height: 100%; transition: transform 0.3s ease, margin-right 0.3s ease; }
            #menu-lateral.recolhido { transform: translateX(-275px); margin-right: -275px; }
        }

        /* ========================================== */
        /* CORREÇÕES EXCLUSIVAS PARA CELULAR (MOBILE) */
        /* ========================================== */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #menu-lateral { width: 100%; height: 40vh; transition: height 0.3s ease; }
            #menu-lateral.recolhido { height: 48px !important; }
            #menu-lateral.recolhido ul#lista-cidades { display: none !important; }
            #menu-lateral h2 { font-size: 1rem; padding: 12px 15px; }
            #menu-lateral h2::after { content: ' ↕'; font-size: 0.8rem; opacity: 0.8; }
            #mapa { flex-grow: 1; height: auto; width: 100%; }
            ul#lista-cidades li { padding: 12px 15px; }
            .info-popup { min-width: 200px; max-width: 240px; }
            
            /* Ajustes cruciais para o cartão não cortar no mobile */
            .legenda-container { 
                padding: 6px 10px; 
                font-size: 11px; 
                max-width: 130px; /* Impede o card de estourar horizontalmente */
            }
            .legenda-linha { margin-bottom: 4px; }
            .legenda-titulo { margin-bottom: 5px; }

            /* Força os blocos de controle do Leaflet a subirem no celular */
            .leaflet-left {
                margin-left: 10px !important;
            }
            .leaflet-bottom {
                margin-bottom: 25px !important; /* Levanta o card para escapar da barra nativa do celular */
            }
        }
    </style>
</head>
<body>

    <div id="menu-lateral">
        <h2>Municípios atendidos nos festejos juninos</h2>
        <ul id="lista-cidades"></ul>
    </div>
    <div id="mapa"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="dados.js"></script>

    <script>
        const mapa = L.map('mapa', { zoomControl: false }).setView([-10.7, -37.4], 8);
        L.control.zoom({ position: 'topright' }).addTo(mapa);
        
        // Camadas de fundo
        const mapaPadrao = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap © CartoDB' });
        const mapaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });
        const mapaEscuro = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap © CartoDB' });

        mapaPadrao.addTo(mapa);
        L.control.layers({ "🗺️ Mapa Claro": mapaPadrao, "🛰️ Visão de Satélite": mapaSatelite, "🌑 Modo Noturno": mapaEscuro }, null, { position: 'topright' }).addTo(mapa);
        
        // Inicialização da legenda
        const legenda = L.control({ position: 'bottomleft' });

        legenda.onAdd = function () {
            const div = L.DomUtil.create('div', 'legenda-container');
            div.id = 'legenda-painel';
            div.innerHTML = `
                <div class="legenda-titulo">Nível de Risco</div>
                <div class="legenda-linha" id="leg-alto"><span class="legenda-circulo lc-alto"></span> Alto Risco</div>
                <div class="legenda-linha" id="leg-medio"><span class="legenda-circulo lc-medio"></span> Médio Risco</div>
                <div class="legenda-linha" id="leg-baixo"><span class="legenda-circulo lc-baixo"></span> Baixo Risco</div>
                <div class="legenda-linha" id="leg-padrao"><span class="legenda-circulo lc-padrao"></span> Não Definido</div>
            `;
            return div;
        };

        legenda.addTo(mapa);

        function atualizarCorDaLegenda(classeRisco) {
            const painel = document.getElementById('legenda-painel');
            const lAlto = document.getElementById('leg-alto');
            const lMedio = document.getElementById('leg-medio');
            const lBaixo = document.getElementById('leg-baixo');
            const lPadrao = document.getElementById('leg-padrao');

            if (!painel) return;

            painel.classList.remove('legenda-alto', 'legenda-medio', 'legenda-baixo', 'legenda-padrao');

            const todasLinhas = [lAlto, lMedio, lBaixo, lPadrao];
            todasLinhas.forEach(linha => {
                if (linha) {
                    linha.style.opacity = '0.3';
                    linha.style.transform = 'scale(1)';
                }
            });

            if (classeRisco === 'risco-alto') {
                painel.classList.add('legenda-alto');
                if (lAlto) { lAlto.style.opacity = '1'; lAlto.style.transform = 'scale(1.05)'; }
            } else if (classeRisco === 'risco-medio') {
                painel.classList.add('legenda-medio');
                if (lMedio) { lMedio.style.opacity = '1'; lMedio.style.transform = 'scale(1.05)'; }
            } else if (classeRisco === 'risco-baixo') {
                painel.classList.add('legenda-baixo');
                if (lBaixo) { lBaixo.style.opacity = '1'; lBaixo.style.transform = 'scale(1.05)'; }
            } else {
                painel.classList.add('legenda-padrao');
                if (lPadrao) { lPadrao.style.opacity = '1'; lPadrao.style.transform = 'scale(1.05)'; }
            }
        }

        const LAT_ARACAJU = -10.9472;
        const LON_ARACAJU = -37.0731;
        
        let linhaVetor;
        let carrinhoAnimado;
        let timerAnimacao;

        const listaCidadesElemento = document.getElementById('lista-cidades');
        const menuLateral = document.getElementById('menu-lateral');

        document.querySelector('#menu-lateral h2').onclick = () => {
            menuLateral.classList.toggle('recolhido');
            setTimeout(() => { mapa.invalidateSize(); }, 320);
        };

        function gerarVetorOperacional(latDestino, lonDestino, marcadorDestino, classeRisco) {
            atualizarCorDaLegenda(classeRisco);

            if (linhaVetor) mapa.removeLayer(linhaVetor);
            if (timerAnimacao) clearInterval(timerAnimacao);
            if (carrinhoAnimado) mapa.removeLayer(carrinhoAnimado);

            let corLinha = '#9e9e9e';
            if (classeRisco === 'risco-alto') corLinha = '#d32f2f';
            if (classeRisco === 'risco-medio') corLinha = '#fbc02d';
            if (classeRisco === 'risco-baixo') corLinha = '#388e3c';

            linhaVetor = L.polyline([[LAT_ARACAJU, LON_ARACAJU], [latDestino, lonDestino]], {
                color: corLinha, weight: 4, opacity: 0.8, dashArray: '8, 8'
            }).addTo(mapa);

            mapa.fitBounds(linhaVetor.getBounds(), { padding: [50, 50] });

            const coordenadasTrajeto = [];
            for (let i = 0; i <= 50; i++) {
                const percentual = i / 50;
                coordenadasTrajeto.push([
                    LAT_ARACAJU + (latDestino - LAT_ARACAJU) * percentual,
                    LON_ARACAJU + (lonDestino - LON_ARACAJU) * percentual
                ]);
            }

            iniciarDeslocamento(coordenadasTrajeto, marcadorDestino, classeRisco);
        }

        function iniciarDeslocamento(pontos, marcadorDestino, classeRisco) {
            const iconeAnimado = L.divIcon({ html: '🚒', className: `marcador-bombeiro ${classeRisco}`, iconSize: [36, 36], iconAnchor: [18, 18] });
            carrinhoAnimado = L.marker(pontos[0], { icon: iconeAnimado }).addTo(mapa);
            let passo = 0;

            timerAnimacao = setInterval(() => {
                passo++;
                if (passo >= pontos.length) {
                    clearInterval(timerAnimacao);
                    if (marcadorDestino) marcadorDestino.openPopup();
                    setTimeout(() => { if (carrinhoAnimado) mapa.removeLayer(carrinhoAnimado); }, 500);
                    return;
                }
                carrinhoAnimado.setLatLng(pontos[passo]);
            }, 25); 
        }

        function gerarHTMLPopup(linha) {
            if (!linha.efetivo && !linha.abts) {
                return `<div class="info-popup"><h3>${linha.nome}</h3><p>Informações operacionais em breve...</p></div>`;
            }
            let html = `<div class="info-popup"><h3>${linha.nome}</h3>`;
            html += `<h4>Informações Gerais</h4>
                     <p>🚒 ABTs: ${linha.abts || '-'}&nbsp;&nbsp;|&nbsp;&nbsp;🚑 UR: ${linha.ur || '-'}</p>
                     <p>👨‍🚒 Efetivo: ${linha.efetivo || '-'}&nbsp;&nbsp;|&nbsp;&nbsp;⚠️ Risco: ${linha.risco || '-'}</p>
                     <p>👨‍🚒 Coordenação: ${linha.coordenacao || '-'}</p>
                     <p>👥 Público Estimado: ${linha.publico || '-'}</p>`;

            if (linha.eventos_programados) html += `<h4>Eventos Programados</h4><p>${linha.eventos_programados.replace(/\n/g, '<br>')}</p>`;
            html += `</div>`;
            return html;
        }

        if (typeof PLANILHA_MANUAL !== 'undefined') {
            PLANILHA_MANUAL.forEach(cidade => {
                const latCidade = parseFloat(cidade.lat);
                const lonCidade = parseFloat(cidade.lon);
                const htmlDoBalao = gerarHTMLPopup(cidade);

                let classeRisco = 'risco-padrao';
                let indicadorLista = '🚒'; 

                if (cidade.risco === 'Alto') { classeRisco = 'risco-alto'; indicadorLista = '🔴'; }
                else if (cidade.risco === 'Médio') { classeRisco = 'risco-medio'; indicadorLista = '🟡'; }
                else if (cidade.risco === 'Baixo') { classeRisco = 'risco-baixo'; indicadorLista = '🟢'; }

                const iconeCustomizado = L.divIcon({ html: '🚒', className: `marcador-bombeiro ${classeRisco}`, iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18] });
                
                const marcador = L.marker([latCidade, lonCidade], { icon: iconeCustomizado })
                    .addTo(mapa)
                    .bindPopup(htmlDoBalao);

                marcador.on('popupopen', () => {
                    atualizarCorDaLegenda(classeRisco);
                });

                const itemLista = document.createElement('li');
                itemLista.innerHTML = `<span class="status-risco-lista">${indicadorLista}</span> <span>${cidade.nome}</span>`;
                
                itemLista.onclick = () => {
                    gerarVetorOperacional(latCidade, lonCidade, marcador, classeRisco);
                    if (window.innerWidth <= 768) {
                        menuLateral.classList.add('recolhido');
                        setTimeout(() => { mapa.invalidateSize(); }, 320);
                    }
                };

                listaCidadesElemento.appendChild(itemLista);
            });
        }
    </script>
</body>
</html>
